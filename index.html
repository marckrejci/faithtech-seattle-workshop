    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body,#root{width:100%;height:100%;background:#E4E0D8;overflow:hidden}
    button{font-family:inherit;cursor:pointer}
    a{color:inherit}
    input,textarea{font-family:inherit}
    @keyframes ft-fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes ft-pulse{0%,100%{opacity:1}50%{opacity:.55}}
    .ft-in{animation:ft-fadeIn 160ms ease-out forwards}
    .ft-out{opacity:0;transition:opacity 80ms ease-in}
    .ft-chrome-btn{background:transparent;border:none;color:#16160C;opacity:.6;display:flex;align-items:center;justify-content:center;padding:6px;border-radius:6px;transition:opacity 150ms}

    .ft-nav-btn{background:transparent;border:none;color:#16160C;font-size:1.1rem;padding:4px 10px;border-radius:4px;opacity:.55;transition:opacity 150ms;display:flex;align-items:center}

    .ft-nav-btn:disabled{opacity:.2;cursor:default}

  // =======================================================
  // AUDIO ENGINE
  // =======================================================
  class AudioEngine {
    constructor() { this.audioElement=null; this.fadeTimer=null; this.muted=false; this.targetVolume=0.28; this.usedTracks=new Set(); this.currentTrack=null; this.endedHandler=null; this.chimeCtx=null; }
    _pickNextTrack() {
      let cands = LOFI_TRACKS.filter(t=>t!==this.currentTrack&&!this.usedTracks.has(t));
      if (!cands.length) { this.usedTracks.clear(); cands = LOFI_TRACKS.filter(t=>t!==this.currentTrack); }
      const pick = cands[Math.floor(Math.random()*cands.length)];
      this.usedTracks.add(pick); this.currentTrack=pick; return pick;
    }
    _trackUrl(f) { return LOFI_DIR+encodeURIComponent(f); }
    _clearFade() { if (this.fadeTimer) { clearInterval(this.fadeTimer); this.fadeTimer=null; } }
    _fadeTo(target,ms) {
      if (!this.audioElement) return; this._clearFade();
      const audio=this.audioElement, start=audio.volume, delta=target-start, t0=performance.now();
      this.fadeTimer=setInterval(()=>{ if(!this.audioElement){this._clearFade();return;} const t=Math.min(1,(performance.now()-t0)/ms); this.audioElement.volume=Math.max(0,Math.min(1,start+delta*t)); if(t>=1)this._clearFade(); },25);
    }
    startMusic() {
      this.stopMusic(0);
      const track=this._pickNextTrack(), audio=new Audio(this._trackUrl(track));
      audio.preload="auto"; audio.volume=0;
      this.endedHandler=()=>{ if(this.audioElement!==audio)return; audio.src=this._trackUrl(this._pickNextTrack()); audio.play().catch(()=>{}); };
      audio.addEventListener("ended",this.endedHandler);
      const p=audio.play(); if(p&&p.catch)p.catch(e=>console.warn("Audio:",e));
      this.audioElement=audio; this._fadeTo(this.muted?0:this.targetVolume,700);
    }
    stopMusic(fadeMs=1000) {
      const audio=this.audioElement; if(!audio)return;
      this.audioElement=null; const handler=this.endedHandler; this.endedHandler=null; this._clearFade();
      const teardown=()=>{ try{if(handler)audio.removeEventListener("ended",handler);audio.pause();audio.src="";audio.load();}catch(e){} };
      if(fadeMs<=0){teardown();return;}
      const sv=audio.volume,t0=performance.now();
      const id=setInterval(()=>{ const t=Math.min(1,(performance.now()-t0)/fadeMs); audio.volume=Math.max(0,sv*(1-t)); if(t>=1){clearInterval(id);teardown();} },25);
    }
    setMuted(m) { this.muted=m; if(this.audioElement)this._fadeTo(m?0:this.targetVolume,250); }
    playChime() {
      if(!this.chimeCtx){const C=window.AudioContext||window.webkitAudioContext;this.chimeCtx=new C();}
      const ctx=this.chimeCtx; if(ctx.state==="suspended")ctx.resume();
      const t=ctx.currentTime,freqs=[523.25,659.25,783.99];
      const master=ctx.createGain();
      master.gain.setValueAtTime(0.0001,t);master.gain.linearRampToValueAtTime(0.45,t+0.04);master.gain.exponentialRampToValueAtTime(0.0001,t+2.6);
      master.connect(ctx.destination);
      freqs.forEach((f,i)=>{
        const o=ctx.createOscillator(),g=ctx.createGain();o.type="sine";o.frequency.value=f;g.gain.value=0.4;
        o.connect(g);g.connect(master);o.start(t+i*0.09);o.stop(t+2.7);
        const o2=ctx.createOscillator(),g2=ctx.createGain();o2.type="sine";o2.frequency.value=f*2;g2.gain.value=0.08;
        o2.connect(g2);g2.connect(master);o2.start(t+i*0.09);o2.stop(t+2.7);
      });
    }
  }

  // Section label -- plain text, no pill background
  function Label({ children, light = false }) {
    return (
      <div style={{ fontSize:"0.72rem", letterSpacing:"0.2em", fontWeight:700, textTransform:"uppercase",
        color: light ? "rgba(255,255,255,0.5)" : MUTED, marginBottom:"0.85rem" }}>
        {children}
      </div>
    );
  }

  // Thin yellow accent rule
  function YellowRule({ mb = "1.5rem" }) {
    return <div style={{ width:44, height:3, background:FT_YELLOW, marginBottom:mb, borderRadius:2 }} />;
  }

  // Pill: backward-compat alias for Label
  function Pill({ children, light = false }) {
    return <Label light={light}>{children}</Label>;
  }

  function formatTime(sec) { const m=Math.floor(sec/60),s=sec%60; return m+":"+(s<10?"0":"")+s; }

  function TimerDisplay({ seconds, warning, ended, compact = false }) {
    const color = ended ? GREEN_OK : warning ? WARN : TEXT;

  // =======================================================
  // TIMER HOOK
  // =======================================================
  function useTimerLogic(durationSec, audio, isActive, musicVariant = "bright", silent = false) {
    const [seconds, setSeconds] = useState(durationSec);
    const [running, setRunning] = useState(false);
    const [muted, setMuted] = useState(false);
    const [ended, setEnded] = useState(false);
    const intervalRef = useRef(null);

    useEffect(()=>{
      setRunning(false); setSeconds(durationSec); setEnded(false);
      if(intervalRef.current){clearInterval(intervalRef.current);intervalRef.current=null;}
      if(!isActive)audio.stopMusic(800);
    },[isActive,durationSec]);

    useEffect(()=>{
      if(!running)return;
      intervalRef.current=setInterval(()=>{ setSeconds(s=>{if(s<=1){clearInterval(intervalRef.current);intervalRef.current=null;return 0;}return s-1;}); },1000);
      return()=>{if(intervalRef.current){clearInterval(intervalRef.current);intervalRef.current=null;}};
    },[running]);

    useEffect(()=>{ if(running&&seconds===0){setRunning(false);setEnded(true);audio.playChime();audio.stopMusic(900);} },[seconds,running,audio]);

    const start = useCallback(()=>{
      if(seconds===0){setSeconds(durationSec);setEnded(false);}
      setRunning(true); if(!silent)audio.startMusic(musicVariant);
    },[seconds,durationSec,audio,musicVariant,silent]);

    const pause    = useCallback(()=>{ setRunning(false); if(!silent)audio.stopMusic(800); },[audio,silent]);
    const reset    = useCallback(()=>{ setRunning(false); setSeconds(durationSec); setEnded(false); if(!silent)audio.stopMusic(800); },[durationSec,audio,silent]);
    const toggleMute = useCallback(()=>{ setMuted(m=>{audio.setMuted(!m);return !m;}); },[audio]);

    return { seconds, running, ended, warning:running&&seconds<=30&&seconds>0, muted,
      isPaused:!running&&!ended&&seconds<durationSec, isIdle:!running&&!ended&&seconds===durationSec,
      start, pause, reset, toggleMute };
  }

    { id: 15, render: ()                    => <Slide11 /> },
    { id: 16, render: ()                    => <Slide12 /> },
    { id: 17, render: ({ isActive, audio }) => <TimerSlide loopLabel="Loop 1: Test" title="Swap and Experience" duration={420} body={swapBody} footer={testFooter} isActive={isActive} audio={audio} /> },
    { id: 18, render: ({ isActive, audio }) => <DiscernmentPrayerSlide phase="loop2" isActive={isActive} audio={audio} /> },
    { id: 19, render: ({ isActive, audio }) => <TimerSlide loopLabel="Loop 2: Idea + Plan + Create" title="Synthesize Loop 1 learnings and iterate" duration={600} body={slide20Body} isActive={isActive} audio={audio} /> },
    { id: 20, render: ({ isActive, audio }) => <TimerSlide loopLabel="Loop 2: Test" title="Swap and Experience: Rotate roles!" duration={300} body={swapBodyL2} footer={testFooter} isActive={isActive} audio={audio} /> },
    { id: 21, render: ({ isActive, audio }) => <DiscernmentPrayerSlide phase="loop3" isActive={isActive} audio={audio} /> },
    { id: 22, render: ({ isActive, audio }) => <TimerSlide loopLabel="Loop 3: Idea + Plan + Create" title="Synthesize Loop 2 learnings and increase fidelity" duration={600} body={slide22Body} isActive={isActive} audio={audio} /> },
    { id: 23, render: ({ isActive, audio }) => <TimerSlide loopLabel="Loop 3: Test" title="Swap and Experience: Final rotation!" duration={300} body={swapBodyL3} footer={testFooter} isActive={isActive} audio={audio} /> },
    { id: 24, render: ({ isActive, audio }) => <Slide24 isActive={isActive} audio={audio} /> },
    { id: 25, render: ({ isActive, audio }) => <Slide25 isActive={isActive} audio={audio} /> },
    { id: 26, render: ()                    => <ClosingSlide /> },
  ];

  // =======================================================
  // PRESENTATION APP
  // =======================================================
  function Presentation() {
    const [current, setCurrent] = useState(0);
    const [visible, setVisible]  = useState(true);
    const audioRef = useRef(null);
    if (!audioRef.current) audioRef.current = new AudioEngine();

    const goTo = useCallback(idx => {
      setCurrent(prev => {
        const next = Math.max(0, Math.min(SLIDES.length-1, idx));
        if (next !== prev) { if (audioRef.current) audioRef.current.stopMusic(600); setVisible(false); setTimeout(()=>setVisible(true),80); }
        return next;
      });
    }, []);

    const goNext = useCallback(()=>goTo(current+1),[current,goTo]);
    const goPrev = useCallback(()=>goTo(current-1),[current,goTo]);

    useEffect(()=>{
      const handler = e => {
        if (e.target&&(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA")) return;
        if (e.key==="ArrowRight"||e.key==="PageDown"||e.key===" "){e.preventDefault();goNext();}
        else if (e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();goPrev();}
        else if (e.key==="Home") goTo(0);
        else if (e.key==="End")  goTo(SLIDES.length-1);
      };
      window.addEventListener("keydown",handler);
      return ()=>window.removeEventListener("keydown",handler);
    },[goNext,goPrev,goTo]);

    useEffect(()=>()=>{audioRef.current&&audioRef.current.stopMusic(0);},[]);

    const touchStart = useRef(null);
    const onTouchStart = e => { touchStart.current = e.touches[0].clientX; };
    const onTouchEnd   = e => {
      if (touchStart.current===null) return;
      const dx = e.changedTouches[0].clientX - touchStart.current;
      if (Math.abs(dx)>50) { if (dx<0) goNext(); else goPrev(); }
      touchStart.current = null;
    };

    const [isFs, setIsFs] = useState(false);
    useEffect(()=>{
      const cb = ()=>setIsFs(!!document.fullscreenElement);
      document.addEventListener("fullscreenchange",cb);
      return ()=>document.removeEventListener("fullscreenchange",cb);
    },[]);
    const toggleFs = ()=>{
      const el=document.documentElement;
      if(!document.fullscreenElement)(el.requestFullscreen||el.webkitRequestFullscreen||(() =>{})).call(el);
      else (document.exitFullscreen||document.webkitExitFullscreen||(() =>{})).call(document);
    };

    const slide = SLIDES[current];

    return (
      <div onTouchStart={onTouchStart} onTouchEnd={onTouchEnd}
        style={{ position:"fixed", inset:0, color:TEXT, fontFamily:FONT_STACK, overflow:"hidden" }}>

        {/* TOP CHROME BAR -- signature FaithTech yellow band */}
        <div style={{ position:"fixed", top:0, left:0, right:0, height:CHROME_TOP,
          background:FT_YELLOW, display:"flex", alignItems:"center",
          padding:"0 24px", justifyContent:"space-between", zIndex:100, flexShrink:0 }}>
          <img src={IMG_LOGOTYPE} alt="FaithTech Seattle" style={{ height:24, display:"block" }} />
          <div style={{ display:"flex", alignItems:"center", gap:14 }}>
            <span style={{ fontSize:"0.65rem", fontWeight:700, letterSpacing:"0.22em", color:FT_BLACK, opacity:0.5 }}>FAITHTECH SEATTLE</span>
            <button onClick={toggleFs} className="ft-chrome-btn" aria-label={isFs?"Exit fullscreen":"Enter fullscreen"}>
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round">
                {isFs ? <React.Fragment><path d="M5 1v4H1"/><path d="M9 1v4h4"/><path d="M5 13V9H1"/><path d="M9 13V9h4"/></React.Fragment>
                      : <React.Fragment><path d="M1 5V1h4"/><path d="M13 5V1H9"/><path d="M1 9v4h4"/><path d="M13 9v4H9"/></React.Fragment>}
              </svg>
            </button>
          </div>
        </div>

        {/* SLIDE CONTENT */}
        <div key={slide.id} className={visible?"ft-in":"ft-out"}
          style={{ position:"absolute", inset:0 }}>
          {slide.render({ isActive:true, audio:audioRef.current })}
        </div>

        {/* BOTTOM CHROME BAR -- navigation + counter */}
        <div style={{ position:"fixed", bottom:0, left:0, right:0, height:CHROME_BOTTOM,
          background:FT_YELLOW, display:"flex", alignItems:"center",
          padding:"0 16px", justifyContent:"space-between", zIndex:100 }}>
          <button onClick={goPrev} disabled={current===0} className="ft-nav-btn" aria-label="Previous slide">
            &larr;
          </button>
          <span style={{ fontSize:"0.7rem", fontWeight:700, letterSpacing:"0.12em", color:FT_BLACK, opacity:0.5, fontVariantNumeric:"tabular-nums" }}>
            {current+1} &thinsp;/&thinsp; {SLIDES.length}
          </span>
          <button onClick={goNext} disabled={current===SLIDES.length-1} className="ft-nav-btn" aria-label="Next slide">
            &rarr;
          </button>
        </div>

      </div>
    );
  }

  const root = ReactDOM.createRoot(document.getElementById("root"));
  root.render(<Presentation />);
</script>
</body>
</html>
